name: Build APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: PWA URL
        required: true
        default: https://maryask.com/bot/
      app_name:
        description: App Name
        required: true
        default: huge
      app_id:
        description: App ID
        required: true
        default: com.maryask.huge

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create wrapper
        run: |
          mkdir -p www
          echo '<html><body><iframe src="${{ inputs.url }}" style="width:100%;height:100%;border:none"></iframe></body></html>' > www/index.html
          echo '{"name":"${{ inputs.app_id }}","version":"1.0.0"}' > www/package.json

      - name: Init and Add Android
        working-directory: www
        run: |
          npx cap init "${{ inputs.app_name }}" "${{ inputs.app_id }}" --web-dir=.
          npx cap add android

      - name: Build APK
        working-directory: www/android
        run: ./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}
          path: www/android/app/build/outputs/apk/debug/app-debug.apk
