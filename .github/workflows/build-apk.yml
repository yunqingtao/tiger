name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: android-actions/setup-android@v3
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"></head><body style=margin:0><iframe src=https://maryask.com/bot/ style=width:100%;height:100%;border:none;position:fixed;top:0;left:0></iframe></body></html>' > www/index.html
      - run: npx cap init Huge com.maryask.huge --web-dir=www
      - run: npx cap add android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: {name: huge-apk, path: android/app/build/outputs/apk/debug/app-debug.apk}
