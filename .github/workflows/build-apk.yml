name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Create web assets
        run: |
          mkdir -p www
          cat > www/index.html << 'ENDHTML'
          <!DOCTYPE html>
          <html>
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
          <body style="margin:0">
          <iframe src="https://maryask.com/bot/" style="width:100%;height:100%;border:none;position:fixed"></iframe>
          </body>
          </html>
          ENDHTML
      - name: Install Capacitor
        run: npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
      - name: Init Capacitor  
        run: npx cap init Huge com.maryask.huge --web-dir=www
      - name: Add Android
        run: npx cap add android
      - name: Build
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
