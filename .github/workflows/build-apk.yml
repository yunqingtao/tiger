name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: android-actions/setup-android@v3

      - run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - run: |
          mkdir -p www
          echo '<html><body style="margin:0"><iframe src="https://maryask.com/bot/" style="width:100%;height:100%;border:none"></iframe></body></html>' > www/index.html
          echo '{"name":"com.maryask.huge","version":"1.0.0"}' > www/package.json

      - run: |
          npx cap init Huge com.maryask.huge --web-dir=.
          npx cap add android
        working-directory: www

      - run: ./gradlew assembleDebug
        working-directory: www/android

      - uses: actions/upload-artifact@v4
        with:
          name: huge-apk
          path: www/android/app/build/outputs/apk/debug/app-debug.apk
