name: TensorFlow
description: Machine learning platform

system:
  os: [windows, macos, linux]
  python: ">=3.9"
  disk_mb: 3000

dependencies:
  python:
    - tensorflow

installation:
  binary: python
  version_cmd: python -c "import tensorflow as tf; print(tf.__version__)"

functionality:
  - name: 版本
    cmd: python -c "import tensorflow as tf; print(tf.__version__)"
    expect_rc: 0
    timeout: 20
  - name: GPU检测
    cmd: python -c "import tensorflow as tf; print('GPU:', tf.config.list_physical_devices('GPU'))"
    expect_rc: 0
    timeout: 15
